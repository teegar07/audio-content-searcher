name: Early audio article refresh
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch latest 30 days
        env:
          DAYS: 30
        run: npm run fetch
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/articles.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update audio articles"
          git pull --rebase origin main
          git push origin HEAD:main
