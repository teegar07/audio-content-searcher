name: Update audio articles
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Run several times before 08:30 Asia/Taipei to provide retry opportunities if GitHub delays a scheduled run.
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
permissions:
  contents: write
concurrency:
  group: update-audio-articles
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fetch latest 30 days
        env:
          DAYS: 30
        run: npm run fetch
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/articles.json
          if git diff --cached --quiet; then
            echo "No article data changes to commit."
            exit 0
          fi
          git commit -m "Update audio articles"
          git pull --rebase origin main
          git push origin HEAD:main
