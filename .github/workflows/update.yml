name: Update audio articles
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 23 * * *'
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: update-audio-articles
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch latest 30 days
        env:
          DAYS: 30
        run: npm run fetch
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/articles.json
          if git diff --cached --quiet; then
            echo "No article data changes to commit."
            exit 0
          fi
          git commit -m "Update audio articles"
          git pull --rebase origin main
          git push origin HEAD:main
