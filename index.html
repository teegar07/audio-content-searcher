<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audio Content Searcher</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#161616;background:#f4f2ed}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:48px 20px 80px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:26px}h1{font-size:clamp(34px,6vw,72px);letter-spacing:-.05em;line-height:.95;margin:0}.sub{max-width:560px;color:#666;line-height:1.6}.generator{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #ddd;border-radius:18px;padding:14px;margin:24px 0}.generator label{font-size:13px;color:#666}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.generator select,.controls select,.controls input{border:1px solid #ccc;border-radius:999px;background:white;padding:10px 14px;font-size:14px}.generator button{border:0;border-radius:999px;background:#161616;color:#fff;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}.generator button:hover{opacity:.86}.meta{color:#777;font-size:13px;margin:10px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.img{aspect-ratio:16/9;background:#dedbd3;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}.content{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee}.card h2{font-size:18px;line-height:1.3;margin:0}.card p{font-size:13px;line-height:1.55;color:#666;margin:0}.card a{color:inherit;text-decoration:none}.date{margin-top:auto;font-size:12px;color:#888}.empty{padding:60px 0;color:#777}@media(max-width:850px){.top{display:block}.sub{margin-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:28px 14px 60px}.grid{grid-template-columns:1fr}.generator{display:grid;grid-template-columns:1fr}.generator select,.generator button{width:100%}.controls{display:grid;grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1;width:100%}}
</style>
</head>
<body><main>
<div class="top"><h1>Audio<br>Searcher</h1><div class="sub">自動彙整 What Hi-Fi?、TechRadar、SoundGuys、Tom's Guide 最近 30 天的音訊產品文章，再依你選擇的期間生成結果。</div></div>
<div class="generator"><label for="range">文章期間</label><select id="range"><option value="7">近一週</option><option value="14">近兩週</option><option value="30">近一個月</option></select><button id="generate" type="button">生成文章</button></div>
<div class="controls"><select id="source"><option value="">全部來源</option></select><select id="category"><option value="">全部分類</option></select><input id="q" placeholder="搜尋品牌、產品或文章標題…"></div>
<div class="meta" id="meta">讀取中…</div><div class="grid" id="grid"></div>
</main><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let all=[],selectedDays=7,generatedAt=null;
const grid=document.querySelector('#grid'),meta=document.querySelector('#meta'),source=document.querySelector('#source'),category=document.querySelector('#category'),q=document.querySelector('#q'),range=document.querySelector('#range'),generate=document.querySelector('#generate');
function inRange(x){const t=new Date(x.publishedAt).getTime();return Number.isFinite(t)&&t>=Date.now()-selectedDays*86400000;}
function render(){const s=source.value,c=category.value,term=q.value.trim().toLowerCase();const rows=all.filter(x=>inRange(x)&&(!s||x.source===s)&&(!c||x.category===c)&&(!term||(`${x.title} ${x.description}`).toLowerCase().includes(term)));const updated=generatedAt?`｜資料更新：${new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short'}).format(new Date(generatedAt))}`:'';meta.textContent=`近 ${selectedDays} 天，共 ${rows.length} 篇${updated}`;grid.innerHTML=rows.length?rows.map(x=>`<article class="card"><a class="img" href="${esc(x.url)}" target="_blank" rel="noopener">${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="">`:''}</a><div class="content"><div class="badges"><span class="badge">${esc(x.source)}</span><span class="badge">${esc(x.category)}</span></div><h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2>${x.description?`<p>${esc(x.description.slice(0,180))}${x.description.length>180?'…':''}</p>`:''}<div class="date">${new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium'}).format(new Date(x.publishedAt))}${x.author?' · '+esc(x.author):''}</div></div></article>`).join(''):'<div class="empty">這個期間目前沒有符合條件的文章。</div>'}
function fillFilters(){source.length=1;category.length=1;[...new Set(all.map(x=>x.source))].sort().forEach(v=>source.add(new Option(v,v)));[...new Set(all.map(x=>x.category))].sort().forEach(v=>category.add(new Option(v,v)));}
generate.addEventListener('click',()=>{selectedDays=Number(range.value);source.value='';category.value='';q.value='';render();});
[source,category,q].forEach(el=>el.addEventListener(el===q?'input':'change',render));
fetch('./data/articles.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error('data');return r.json()}).then(d=>{all=d.articles||[];generatedAt=d.generatedAt||null;fillFilters();render()}).catch(()=>{meta.textContent='目前還沒有文章資料。請先讓 GitHub Action 完成一次資料更新。';grid.innerHTML='<div class="empty">尚未抓取文章。</div>'});
</script></body></html>
